name: PR Core Safety

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-safety-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-safety:
    name: Core safety + critical build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require PR head to contain current main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --no-tags
          if ! git merge-base --is-ancestor "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"; then
            echo "::error::Release-branch mangler commits som allerede ligger i ${{ github.base_ref }}. Synkroniser/rebaser fra fersk main før Production-merge."
            echo "Commits som finnes i main, men ikke i PR-head:"
            git log --oneline "${{ github.event.pull_request.head.sha }}..origin/${{ github.base_ref }}" || true
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify scope guard logic
        run: node scripts/critical-pr-scope-guard.mjs --self-test

      - name: Verify release documentation guard logic
        run: node scripts/critical-release-docs-check.mjs --self-test

      - name: Enforce PR scope isolation
        if: github.event_name == 'pull_request'
        run: node scripts/critical-pr-scope-guard.mjs "origin/${{ github.base_ref }}"

      - name: Enforce production release documentation on PR
        if: github.event_name == 'pull_request'
        run: node scripts/critical-release-docs-check.mjs "origin/${{ github.base_ref }}"

      - name: Audit production release documentation on main push
        if: github.event_name == 'push'
        run: node scripts/critical-release-docs-check.mjs "${{ github.event.before }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full critical build
        run: npm run build
