name: PR Core Safety

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-core-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core-safety:
    name: Core safety + critical build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify scope guard logic
        run: node scripts/critical-pr-scope-guard.mjs --self-test

      - name: Enforce PR scope isolation
        run: node scripts/critical-pr-scope-guard.mjs "origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full critical build
        run: npm run build

      - name: Verify isolated HR control cycle
        run: node scripts/critical-hr-control-cycle-check.mjs

      - name: Verify isolated HR cloud probe
        run: node scripts/critical-hr-cloud-probe-check.mjs

      - name: Verify explicit isolated HR bootstrap
        run: node scripts/critical-hr-control-bootstrap-check.mjs

      - name: Verify isolated HR bootstrap SQL
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hr-bootstrap-sql" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8 @vercel/blob@2.8.1 undici@6.29.0
          HR_PGLITE_PATH="$RUNNER_TEMP/hr-bootstrap-sql/node_modules/@electric-sql/pglite/dist/index.js" node scripts/hr-control-bootstrap-db-check.mjs
          HR_PGLITE_PATH="$RUNNER_TEMP/hr-bootstrap-sql/node_modules/@electric-sql/pglite/dist/index.js" node scripts/hr-control-integration-db-check.mjs
          HR_LEDGER_BLOB_SDK_ROOT="$RUNNER_TEMP/hr-bootstrap-sql/node_modules/@vercel/blob" node scripts/hr-bootstrap-sdk-contract-check.mjs
