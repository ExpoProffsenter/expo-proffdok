name: TEMP FASE42E short offset label

on:
  push:
    branches:
      - feature/fase42e-badskisse-forbedringer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fase42e-badskisse-forbedringer
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temp-fase42e-short-offset-label.py
      - name: Commit result and remove temporary files
        run: |
          rm scripts/temp-fase42e-short-offset-label.py .github/workflows/fase42e-short-offset-label.yml
          git config user.name "ExpoProffsenter"
          git config user.email "firmapost@ringside.no"
          git add src/modules/sales/components/SalesBathroomSketch.jsx scripts/critical-bathroom-sketch-check.mjs scripts/temp-fase42e-short-offset-label.py .github/workflows/fase42e-short-offset-label.yml
          git commit -m "FASE 42E: gjør korte plasseringsmål lesbare"
          git push origin HEAD:feature/fase42e-badskisse-forbedringer
