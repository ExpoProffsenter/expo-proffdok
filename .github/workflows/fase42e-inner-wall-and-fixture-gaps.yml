name: TEMP FASE42E inner wall and fixture gaps

on:
  push:
    branches:
      - feature/fase42e-badskisse-forbedringer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fase42e-badskisse-forbedringer
          fetch-depth: 0
      - name: Correct QA anchor in temporary patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/temp-fase42e-inner-wall-and-fixture-gaps.py")
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith("qa_anchor = "):
                  lines[index] = "qa_anchor = \"  requireText(component, 'const SNAP_EDGE_DISTANCE = 10;', `${componentPath}: kontrollert kant-snapping mangler.`);\\n\""
                  break
          else:
              raise SystemExit("qa_anchor not found")
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Apply patch
        run: python scripts/temp-fase42e-inner-wall-and-fixture-gaps.py
      - name: Commit result and remove temporary files
        run: |
          rm scripts/temp-fase42e-inner-wall-and-fixture-gaps.py .github/workflows/fase42e-inner-wall-and-fixture-gaps.yml
          git config user.name "ExpoProffsenter"
          git config user.email "firmapost@ringside.no"
          git add src/modules/sales/components/SalesBathroomSketch.jsx src/modules/help/helpToolsCore.js scripts/critical-bathroom-sketch-check.mjs scripts/temp-fase42e-inner-wall-and-fixture-gaps.py .github/workflows/fase42e-inner-wall-and-fixture-gaps.yml
          git commit -m "FASE 42E: mål fra innvendig veggliv og utvendige utstyrsmål"
          git push origin HEAD:feature/fase42e-badskisse-forbedringer
