            const endMm = Math.max(0, Math.round((1 - projected.t) * wallMm));
            const anchor = startMm <= endMm ? "start" : "end";
            return {
              wall,
              projected,
              anchor,
              distanceMm: anchor === "start" ? startMm : endMm,
              sidePoint: wallPoint(wall, anchor === "start" ? 0 : 1),
