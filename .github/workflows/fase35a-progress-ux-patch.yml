name: Fase 35A progress UX patch

on:
  push:
    branches:
      - feature/fase35a-progress-plan
    paths:
      - scripts/fase35a-progress-ux-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fase35a-progress-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused Fremdrift UX patch
        run: python scripts/fase35a-progress-ux-patch.py
      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified UX change
        run: |
          rm -rf node_modules dist
          git checkout -- package-lock.json || true
          rm -f scripts/fase35a-progress-ux-patch.py
          rm -f .github/workflows/fase35a-progress-ux-patch.yml
          git config user.name "ExpoProffsenter"
          git config user.email "firmapost@ringside.no"
          git add -A
          git commit -m "Fase 35A: sticky handlinger og hopp til ny arbeidsoperasjon"
          git push origin HEAD:feature/fase35a-progress-plan
