name: Fase 35A nav refresh patch
on:
  push:
    branches:
      - feature/fase35a-progress-plan
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refresh navigation patch
        run: node scripts/fase35a-nav-refresh-patch.cjs
      - name: Verify build
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Commit verified refresh fix
        run: |
          rm -f .github/workflows/fase35a-nav-refresh-patch.yml
          rm -f .github/workflows/fase35a-nav-inspect.yml
          rm -f .github/fase35a-nav-refresh-trigger.txt
          rm -f scripts/fase35a-nav-refresh-patch.cjs
          git config user.name "ExpoProffsenter"
          git config user.email "firmapost@ringside.no"
          git add src/main.jsx .github scripts/fase35a-nav-refresh-patch.cjs || true
          git commit -m "Fase 35A: behold prosjekt og fane ved refresh"
          git push
