name: Fase 35A cleanup native Fremdrift

on:
  push:
    branches:
      - feature/fase35a-progress-plan
    paths:
      - .github/workflows/fase35a-native-progress-patch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fase35a-progress-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove generated files and restore lock baseline
        run: |
          rm -rf node_modules dist
          git checkout 27aa923003993dccedea80a98b52e3cfec138061 -- package-lock.json
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          EOF
      - name: Verify clean source with Vercel install method
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit cleanup only
        run: |
          rm -rf node_modules dist
          git checkout 27aa923003993dccedea80a98b52e3cfec138061 -- package-lock.json
          rm .github/workflows/fase35a-native-progress-patch.yml
          git config user.name "ExpoProffsenter"
          git config user.email "firmapost@ringside.no"
          git add -A
          git commit -m "Fase 35A: rydd genererte buildfiler"
          git push origin HEAD:feature/fase35a-progress-plan
