name: Fase 35A native Fremdrift patch

on:
  push:
    branches:
      - feature/fase35a-progress-plan
    paths:
      - .github/workflows/fase35a-native-progress-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fase35a-progress-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply native Fremdrift patch
        run: python scripts/fase35a-native-progress-patch.py
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit verified native integration
        run: |
          rm .github/workflows/fase35a-native-progress-patch.yml
          rm -f .github/workflows/fase35a-native-progress-patch-v2.yml
          rm scripts/fase35a-native-progress-patch.py
          git config user.name "ExpoProffsenter"
          git config user.email "firmapost@ringside.no"
          git add -A
          git commit -m "Fase 35A: native React-fane for Fremdrift"
          git push origin HEAD:feature/fase35a-progress-plan
