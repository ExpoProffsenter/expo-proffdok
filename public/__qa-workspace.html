<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Intern responsiv appprøve</title><style>body{margin:0;background:#34434d;color:white;font:16px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center}input,button{font:16px system-ui;padding:6px}input{width:90px}iframe{display:block;border:0;background:white}</style><header><label>Bredde <input id="width" type="number" value="1360"></label><label>Høyde <input id="height" type="number" value="844"></label><button id="reload">Last inn app</button></header><iframe width="1360" height="844" src="/" title="Faktisk app-Preview"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#width').oninput=e=>f.width=e.target.value;document.querySelector('#height').oninput=e=>f.height=e.target.value;document.querySelector('#reload').onclick=()=>f.src='/?qa='+Date.now();</script></html>
